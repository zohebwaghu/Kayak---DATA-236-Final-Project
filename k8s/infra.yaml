apiVersion: v1
kind: Namespace
metadata:
  name: kayak
---
# Zookeeper (single replica for dev)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: kayak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.4.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: kayak
spec:
  ports:
    - port: 2181
      targetPort: 2181
  selector:
    app: zookeeper
---
# Kafka (single broker for dev)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: kayak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.4.0
          ports:
            - containerPort: 9093
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper.kayak.svc.cluster.local:2181
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kayak
spec:
  ports:
    - port: 9093
      targetPort: 9093
  selector:
    app: kafka
---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kayak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args: ["redis-server", "--appendonly", "yes"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kayak
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
# MySQL (dev)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: kayak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: password
            - name: MYSQL_DATABASE
              value: kayak_users
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: kayak
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mysql
---
# MongoDB (dev)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: kayak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: kayak
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb
