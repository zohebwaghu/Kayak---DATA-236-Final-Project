apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: kayak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: API_GATEWAY_PORT
              value: "3000"
            - name: KAFKA_BROKER
              value: kafka.kayak.svc.cluster.local:9093
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: kayak
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: gateway
---
# User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: kayak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DB_USERS
              value: kayak_users
            - name: REDIS_URL
              value: redis://redis:6379
            - name: KAFKA_BROKER
              value: kafka.kayak.svc.cluster.local:9093
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: kayak
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: user-service
